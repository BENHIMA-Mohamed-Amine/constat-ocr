[project]
name = "constat-ocr"
version = "0.1.0"
description = "Extract structured data from scanned Moroccan car-accident reports (constat amiable), measured against synthetic ground truth"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jiwer>=4.0.0",
    "langchain>=1.0,<2.0",
    "langchain-community>=0.4.2,<0.5",
    "langchain-core>=1.0,<2.0",
    "langchain-groq>=1.1.3",
    "langgraph>=1.0,<2.0",
    "langsmith>=0.14.1",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.3",
]

[tool.ruff.lint]
select = ["I"]
